[project]
name = "heydoc-gateway"
version = "0.1.0"
description = "WhatsApp agent gateway for diagnostics-lab bookings"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "asyncpg==0.30.0",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
